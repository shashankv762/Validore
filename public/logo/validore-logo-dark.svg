<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="goldMain" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ECC830"/>
      <stop offset="40%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#A07010"/>
    </linearGradient>
  </defs>
  <!-- Icon at 0,0 scaled to 60x60 -->
  <!-- Shadow -->
  <polygon points="56,20 42,6 18,6 4,20 4,40 18,54 42,54 56,40"
    fill="#7A5B00" transform="translate(2,2)" opacity="0.5"/>
  <!-- Dark facet -->
  <polygon points="30,30 56,20 56,40 42,54 18,54 30,30" fill="#A07010"/>
  <!-- Light facet -->
  <polygon points="30,30 4,40 4,20 18,6 42,6 30,30" fill="#ECC830"/>
  <!-- Main -->
  <polygon points="56,20 42,6 18,6 4,20 4,40 18,54 42,54 56,40" fill="url(#goldMain)"/>
  <!-- Checkmark -->
  <polyline points="16,31 25,40 44,21" fill="none" stroke="#141414" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark -->
  <text x="72" y="40" font-family="'Nunito', 'Outfit', system-ui, sans-serif" font-size="30" font-weight="300" letter-spacing="-0.5" fill="#F5F0E8">validore</text>
</svg>
