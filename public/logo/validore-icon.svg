<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldMain" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ECC830"/>
      <stop offset="40%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#A07010"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC830"/>
      <stop offset="100%" stop-color="#C89010"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  <!-- Shadow polygon (slightly offset) -->
  <polygon points="88,35 66,11 34,11 12,35 12,65 34,89 66,89 88,65"
    fill="#7A5B00" transform="translate(3,4)" opacity="0.5"/>
  <!-- Bottom-right facet (darker) -->
  <polygon points="50,50 88,35 88,65 66,89 34,89 50,50"
    fill="#A07010"/>
  <!-- Top-left facet (lighter) -->
  <polygon points="50,50 12,65 12,35 34,11 66,11 50,50"
    fill="#ECC830"/>
  <!-- Main front face -->
  <polygon points="88,35 66,11 34,11 12,35 12,65 34,89 66,89 88,65"
    fill="url(#goldMain)"/>
  <!-- Checkmark -->
  <polyline points="28,52 41,66 72,35"
    fill="none" stroke="#141414" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
