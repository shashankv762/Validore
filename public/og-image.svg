<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#1e1e1e"/>
    </linearGradient>
    <linearGradient id="goldMain" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ECC830"/>
      <stop offset="40%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#A07010"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECC830"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#C8A860"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <rect width="1200" height="630" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Gold accent bar top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#goldMain)"/>

  <!-- Logo icon (large, centered-left) -->
  <!-- Shadow -->
  <polygon points="248,228 194,162 106,162 52,228 52,322 106,388 194,388 248,322"
    fill="#7A5B00" transform="translate(6,8)" opacity="0.4"/>
  <!-- Dark facet -->
  <polygon points="150,275 248,228 248,322 194,388 106,388 150,275" fill="#A07010"/>
  <!-- Light facet -->
  <polygon points="150,275 52,322 52,228 106,162 194,162 150,275" fill="#ECC830"/>
  <!-- Main -->
  <polygon points="248,228 194,162 106,162 52,228 52,322 106,388 194,388 248,322"
    fill="url(#goldMain)"/>
  <!-- Checkmark -->
  <polyline points="88,278 126,318 212,224"
    fill="none" stroke="#141414" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="290" y="310" font-family="'Nunito', 'Outfit', system-ui, -apple-system, sans-serif"
    font-size="110" font-weight="300" letter-spacing="-2" fill="#F5F0E8">validore</text>

  <!-- Gold underline accent -->
  <rect x="290" y="330" width="120" height="4" fill="url(#goldMain)" rx="2"/>

  <!-- Tagline -->
  <text x="292" y="390" font-family="system-ui, -apple-system, sans-serif"
    font-size="28" font-weight="300" fill="#F5F0E8" opacity="0.6">Know it's gold before you dig.</text>

  <!-- Bottom divider -->
  <rect x="0" y="556" width="1200" height="1" fill="#ffffff" opacity="0.08"/>

  <!-- Bottom bar -->
  <text x="60" y="598" font-family="system-ui, sans-serif" font-size="22" fill="#F5F0E8" opacity="0.35">AI-Powered Startup Validation</text>
  <text x="1140" y="598" font-family="system-ui, sans-serif" font-size="22" fill="#D4A017" opacity="0.7" text-anchor="end">validore.app</text>
</svg>
