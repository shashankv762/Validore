# Local production-style stack. This still needs configured external Supabase/AI services.
# Build: docker compose --env-file .env.local up --build --wait
services:
  app:
    image: ${VALIDORE_IMAGE:-validore:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL via --env-file .env.local}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY via --env-file .env.local}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL via --env-file .env.local}
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        VERSION: ${VERSION:-local}
    restart: unless-stopped
    env_file: .env.local
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:3000:3000'
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [validore-net]
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:80'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [validore-net]
networks:
  validore-net:
    driver: bridge
